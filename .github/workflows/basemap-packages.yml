# Base-map vector tiles for the PFMA NAV VFR chart, one PMTiles file per Geofabrik extract.
#
# OpenStreetMap data (ODbL) turned into the OpenMapTiles schema (CC-BY 4.0) by Planetiler, keeping only
# what the chart draws (urban areas, water, rivers, roads, place names, peaks, runways and aerodromes)
# up to zoom 12. The base
# map changes slowly: it runs every three months, or on demand for some countries.
#
# A run publishes the release basemap-YYYYMMDD-HHMM (never marked "latest": that is the airspace
# packages') and, once every extract built, updates basemap-index.json in the fixed release
# "basemap-index": each country points to the release of its newest extract, so a run for a few
# countries keeps the rest. A failed extract keeps its previous entry; the run then ends as failed.
name: Base map packages

on:
  schedule:
    - cron: '0 4 2 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      countries:
        description: 'Countries (all, or ISO codes such as CL,AR)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: basemap-packages
  cancel-in-progress: false

env:
  PLANETILER_VERSION: v0.10.2
  PLANETILER_SHA256: f310bd0413e2e4512b27f4046d418664e8e1d3bf31603c2a70e23de06c167e4d
  LAYERS: landuse,water,waterway,transportation,place,mountain_peak,aeroway,aerodrome_label
  MAXZOOM: '12'
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Plan extracts
        id: plan
        run: |
          python3 scripts/basemap_plan.py "${{ inputs.countries || 'all' }}"
          echo "tag=basemap-$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6
        with:
          name: plan
          path: plan.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Planetiler
        run: |
          curl -fsSL -o planetiler.jar "https://github.com/onthegomap/planetiler/releases/download/$PLANETILER_VERSION/planetiler.jar"
          echo "$PLANETILER_SHA256  planetiler.jar" | sha256sum -c -

      # Water polygons and Natural Earth (about 1.3 GB) are shared by every extract: download them once
      # per run, under the names Planetiler expects, and hand them to the build jobs through the cache.
      # Their servers have brief outages: retry for a few minutes before failing the run.
      - name: Shared sources
        run: |
          mkdir -p sources
          get() {
            curl -fsSL --retry 6 --retry-delay 30 --retry-all-errors \
              -A "PFMA-NAV-basemap (github.com/PFMA-NAV/pfma-nav-data)" -o "sources/$2" "$1"
          }
          get https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip water-polygons-split-3857.zip
          get https://naciscdn.org/naturalearth/packages/natural_earth_vector.sqlite.zip natural_earth_vector.sqlite.zip
          ls -la sources

      - uses: actions/cache/save@v5
        with:
          path: sources
          key: basemap-sources-${{ github.run_id }}

      - name: Release for this run
        run: |
          gh release create "${{ steps.plan.outputs.tag }}" --repo "$GITHUB_REPOSITORY" \
            --prerelease --latest=false --title "Mapa base ${{ steps.plan.outputs.tag }}" \
            --notes "Base map vector tiles (OpenMapTiles schema) for PFMA NAV, built with Planetiler from Geofabrik extracts. © OpenMapTiles © OpenStreetMap contributors. Data ODbL 1.0; schema CC-BY 4.0. Not for navigation."

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # The cache service fails now and then: without it, the shared sources are downloaded again below.
      - uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: sources
          key: basemap-sources-${{ github.run_id }}

      - name: Build ${{ matrix.area }}
        run: |
          # /mnt has far more free space than the root disk of the runner.
          sudo mkdir -p /mnt/pt && sudo chown "$USER" /mnt/pt
          mkdir -p sources && mv sources /mnt/pt/sources
          for f in water-polygons-split-3857.zip:https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip \
                   natural_earth_vector.sqlite.zip:https://naciscdn.org/naturalearth/packages/natural_earth_vector.sqlite.zip; do
            name="${f%%:*}"; url="${f#*:}"
            if [ ! -s "/mnt/pt/sources/$name" ]; then
              echo "Cache missed: downloading $name"
              curl -fsSL --retry 6 --retry-delay 30 --retry-all-errors \
                -A "PFMA-NAV-basemap (github.com/PFMA-NAV/pfma-nav-data)" -o "/mnt/pt/sources/$name" "$url"
            fi
          done
          curl -fsSL -o planetiler.jar "https://github.com/onthegomap/planetiler/releases/download/$PLANETILER_VERSION/planetiler.jar"
          echo "$PLANETILER_SHA256  planetiler.jar" | sha256sum -c -
          start=$(date +%s)
          # Geofabrik may refuse bursts of parallel downloads: retry with pauses before giving up.
          curl -fsSL --retry 6 --retry-delay 30 --retry-all-errors \
            -A "PFMA-NAV-basemap (github.com/PFMA-NAV/pfma-nav-data)" \
            -o "/mnt/pt/sources/${{ matrix.area }}.osm.pbf" "${{ matrix.url }}"
          java -Xmx10g -jar planetiler.jar --osm_path="/mnt/pt/sources/${{ matrix.area }}.osm.pbf" --download \
            --download_dir=/mnt/pt/sources --tmpdir=/mnt/pt/tmp \
            --output="/mnt/pt/${{ matrix.area }}.pmtiles" --maxzoom="$MAXZOOM" --only_layers="$LAYERS"
          file="/mnt/pt/${{ matrix.area }}.pmtiles"
          bytes=$(stat -c %s "$file"); sha=$(sha256sum "$file" | cut -d' ' -f1)
          echo "${{ matrix.area }}: $(( $(date +%s) - start )) s, $bytes bytes" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p results
          python3 -c 'import json,sys; print(json.dumps({"area":sys.argv[1],"file":sys.argv[1]+".pmtiles","sha256":sys.argv[2],"bytes":int(sys.argv[3]),"countries":json.loads(sys.argv[4])}))' \
            "${{ matrix.area }}" "$sha" "$bytes" '${{ toJson(matrix.countries) }}' > "results/${{ matrix.area }}.json"
          gh release upload "${{ needs.plan.outputs.tag }}" "$file" --repo "$GITHUB_REPOSITORY" --clobber

      - uses: actions/upload-artifact@v6
        with:
          name: result-${{ matrix.area }}
          path: results/

  publish:
    needs: [plan, build]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: plan

      - uses: actions/download-artifact@v7
        with:
          pattern: result-*
          path: results
          merge-multiple: true

      - name: Index
        run: |
          tag="${{ needs.plan.outputs.tag }}"
          # Start from the published index so a run for a few countries keeps the others.
          gh release download basemap-index --repo "$GITHUB_REPOSITORY" --pattern basemap-index.json \
            --output previous-index.json 2>/dev/null || echo "No previous index"
          # Extracts that failed keep their previous entry (or stay unavailable); the rest is published
          # anyway, and the run still ends as failed so GitHub e-mails about it.
          failed=0
          python3 scripts/basemap_index.py "$tag" results plan.json previous-index.json || failed=1
          gh release upload "$tag" basemap-index.json --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest=false
          if ! gh release view basemap-index --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create basemap-index --repo "$GITHUB_REPOSITORY" --latest=false \
              --title "Índice del mapa base" \
              --notes "basemap-index.json points to the current base-map release. © OpenMapTiles © OpenStreetMap contributors."
          fi
          gh release upload basemap-index basemap-index.json --repo "$GITHUB_REPOSITORY" --clobber
          head -c 1500 basemap-index.json
          exit $failed
